<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaS Research</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='black'/><g fill='white'><rect x='5' y='20' width='2' height='7'/><rect x='10' y='16' width='2' height='11'/><rect x='15' y='12' width='2' height='15'/><rect x='20' y='8' width='2' height='19'/><rect x='25' y='4' width='2' height='23'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--dim:#8c8c8c;--rule:#333;--hd:#555;color-scheme:dark}
:root[data-t="blue"]{--bg:#1022ff;--dim:rgba(255,255,255,.75);--rule:rgba(255,255,255,.4);--hd:#3345ff}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--fg);font:300 15px/1.75 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
::selection{background:var(--fg);color:var(--bg)}
a{color:inherit}
a:focus-visible{outline:1px solid var(--fg);outline-offset:4px}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--rule)}
.bar{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:center;justify-content:space-between;padding-top:26px;padding-bottom:22px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;font-weight:300;font-size:20px;letter-spacing:.01em}
.brand svg{display:block;fill:#fff}
nav{display:flex;gap:26px;font-size:14px}
nav a{text-decoration:none;color:var(--dim);padding-bottom:3px;border-bottom:1px solid transparent}
nav a:hover,nav a.on{color:var(--fg);border-bottom-color:var(--fg)}
main{padding-top:56px;padding-bottom:96px;min-height:64vh}
h1{font-weight:200;font-size:clamp(36px,8vw,64px);line-height:1.08;letter-spacing:-.02em;margin:0 0 22px}
h2{font-weight:300;font-size:20px;margin:42px 0 8px}
.lede{color:var(--dim);margin:0 0 30px;max-width:56ch}
.bars{margin:0 0 48px}
.bars i{display:block;height:18px;background:var(--fg)}
.bars i+i{margin-top:12px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:0 18px;padding:22px 0;border-top:1px solid var(--rule);text-decoration:none}
.row:last-of-type{border-bottom:1px solid var(--rule)}
.row:hover{background:var(--fg);color:var(--bg)}
.row:hover .dim{color:var(--hd)}
.row h3{font-weight:300;font-size:19px;line-height:1.4;margin:0}
.row p{margin:4px 0 0}
.dim{color:var(--dim)}
.meta{color:var(--dim);font-size:13px;margin:0 0 34px}
article p,article li{max-width:66ch}
article ul{padding-left:20px}
blockquote{margin:26px 0;padding-left:18px;border-left:1px solid var(--fg);color:var(--dim)}
.wide{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--rule);padding:9px 12px 9px 0;text-align:left;font-weight:300}
th{color:var(--dim)}
.disc{font-size:13px;color:var(--dim);border-top:1px solid var(--rule);margin-top:52px;padding-top:18px;max-width:66ch}
.back{display:inline-block;margin-bottom:34px;color:var(--dim);text-decoration:none;font-size:14px}
.back:hover{color:var(--fg)}
footer{border-top:1px solid var(--rule);font-size:13px;color:var(--dim)}
footer .wrap{padding-top:24px;padding-bottom:28px}

header,main,footer{position:relative;z-index:1}
#ascii{position:fixed;inset:0;margin:0;overflow:hidden;z-index:0;pointer-events:none;color:#fff;opacity:.17;font:11.6px/13px "JetBrains Mono",ui-monospace,monospace;white-space:pre}
#tg{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:5;writing-mode:vertical-rl;background:var(--bg);color:var(--fg);border:1px solid var(--fg);border-right:0;padding:16px 8px;font:300 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.06em;cursor:pointer}
#tg:hover{background:var(--fg);color:var(--bg)}
.ctl{margin:0 0 26px}
#q{width:100%;background:transparent;color:var(--fg);border:1px solid var(--fg);padding:11px 14px;font:inherit;border-radius:0;margin-bottom:14px}
#q::placeholder{color:var(--dim)}
.chip{background:transparent;color:var(--dim);border:1px solid var(--rule);padding:5px 12px;margin:0 8px 8px 0;font:inherit;font-size:13px;cursor:pointer}
.chip:hover,.chip.on{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.th{display:none;width:88px;height:auto;border:1px solid var(--rule);background:#fff;align-self:start}
.btn{display:inline-block;border:1px solid var(--fg);padding:8px 18px;text-decoration:none;margin:0 0 22px}
.btn:hover{background:var(--fg);color:var(--bg)}
.pdf{display:block;width:100%;height:82vh;border:1px solid var(--rule);background:#222;margin:0 0 36px}
.pdf p{padding:20px}
@media(max-width:560px){body{font-size:14px}.row{grid-template-columns:44px 1fr auto}}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<pre id="ascii" aria-hidden="true"></pre>
<button id="tg" type="button" aria-pressed="false">Theme: Blue</button>
<header><div class="wrap bar">
  <a class="brand" href="#research" aria-label="RaS Research home">
    <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true">
      <rect x="0" y="20" width="2" height="8"/><rect x="5" y="16" width="2" height="12"/><rect x="10" y="12" width="2" height="16"/>
      <rect x="15" y="8" width="2" height="20"/><rect x="20" y="4" width="2" height="24"/><rect x="25" y="0" width="2" height="28"/>
      <rect x="30" y="0" width="4" height="2"/>
    </svg>
    <span>RaS Research</span>
  </a>
  <nav id="nav">
    <a href="#research" data-r="research">Research</a>
    <a href="#about" data-r="about">About</a>
    <a href="#contact" data-r="contact">Contact</a>
    <a href="#disclaimer" data-r="disclaimer">Disclaimer</a>
  </nav>
</div></header>
<main class="wrap" id="view"></main>
<footer><div class="wrap">&copy; <span id="yr"></span> RaS Research.
<a href="#disclaimer">Disclaimer</a> &nbsp;
<a href="https://github.com/Rajvardhan-Singh-exe" target="_blank" rel="noopener">GitHub</a> &nbsp;
<a href="https://www.linkedin.com/in/rajvardhan-singh-b56014265/">linkedin</a></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ============================================================
   HOW TO PUBLISH: add a new object at the TOP of POSTS.
   slug  = letters, digits, hyphens only (link: yoursite.com/#slug)
   tag   = category label
   body  = HTML (<p>, <h2>, <ul>, <blockquote>, <table>)
   Save, re-upload. Done.
   ============================================================ */
const SITE = {
  name: "Rajvardhan Singh",
  email: "rajvardhansinghbaruwar@gmail.com",
  about: [
    "RaS Research is an independent research publication by Rajvardhan, a computer science student at MIT Manipal.",
    "It publishes technical analysis on robotics, AI, space infrastructure and clean energy, with reasoning and sources shown."
  ]
};

const POSTS = [
  {
    slug: "welcome",
    title: "Welcome",
    date: "2026-11-16",
    tag: "Note",
    pdf: "",   // e.g. "reports/my-report.pdf"
    summary: "What this site publishes and how each report is structured.",
    body: `
      <p>Every report follows one structure: the claim, the evidence, what would prove it wrong.</p>
      <h2> To contact me please head to the bottom of the page to find my linkedin , github, X .</h2>
      <p> #to add content#.</p>
      <h2>The evidence</h2>
      <ul><li>Source one, with a link</li><li>Source two, with a link</li></ul>
      <blockquote>Key finding or quote goes here.</blockquote>
      <h2>What would change this view</h2>
      <p>List the observations that would falsify the thesis.</p>
      <div class="wide"><table>
        <tr><th>Metric</th><th>Value</th><th>Source</th></tr>
        <tr><td>Example</td><td>0.00</td><td>Link</td></tr>
      </table></div>`
  },
  {
    slug: "copyright",
    title: "Intellectual Property and other Content",
    date: "2026-11-16",
    tag: "Note",
    summary: "for any concerns regarding intellectual property and other content please contact rajvardhansinghbaruwar@gmail.com at your earliest convinence .",
    body: `
      <p>The Aim of the Site is to provied information regarding current State of tech primarily in AI and robotics .</p>
      <p>If any data or information is found which is incorrect or has any other problem with it , it will be fixed or removed at the earliest  .</p>
    <h2> To contact me please head to the bottom of the page to find my linkedin , github, X .</h2>
      `
  }
];

const $ = s => document.querySelector(s);
const view = $("#view");
const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
const pad = n => String(n).padStart(3, "0");
const DISC = "RaS Research publishes opinion and analysis for informational purposes only. Nothing here is investment, legal or professional advice. Information comes from sources believed reliable but is not guaranteed accurate or complete. The author may hold positions in assets discussed. Do your own research.";

let q = "", tagF = "All";
const strip = h => h.replace(/<[^>]+>/g, " ");
const ranked = () => [...POSTS].sort((a, b) => b.date.localeCompare(a.date));   // newest first, automatic
function rowsHTML(){
  const all = ranked(), n = all.length, k = q.trim().toLowerCase();
  const hits = all.map((p, i) => ({p, num: n - i})).filter(({p}) =>
    (tagF === "All" || p.tag === tagF) && (!k || (p.title + " " + p.summary + " " + p.tag + " " + strip(p.body)).toLowerCase().includes(k)));
  if(!hits.length) return `<p class="dim">No reports match.</p>`;
  return hits.map(({p, num}) => `<a class="row" href="#${p.slug}"><span class="dim">${pad(num)}</span><span><h3>${p.title}</h3><p class="dim">${p.tag}, ${fmt(p.date)}${p.pdf ? ", PDF" : ""}</p><p class="dim">${p.summary}</p></span>${p.pdf ? `<canvas class="th" data-pdf="${encodeURI(p.pdf)}"></canvas>` : "<span></span>"}</a>`).join("");
}
const chips = () => ["All", ...new Set(POSTS.map(p => p.tag))].map(t => `<button type="button" class="chip${t === tagF ? " on" : ""}" data-tag="${t}">${t}</button>`).join("");
function list(){
  return `<h1>Research</h1><p class="lede">Independent analysis, published as it is finished.</p>
    <div class="bars" aria-hidden="true"><i></i><i></i></div>
    <div class="ctl"><input id="q" type="search" placeholder="Search reports" aria-label="Search reports"><div id="chips">${chips()}</div></div>
    <div id="rows">${rowsHTML()}</div>`;
}
function thumbs(){
  if(!window.pdfjsLib) return;
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  document.querySelectorAll("canvas.th").forEach(c => {
    pdfjsLib.getDocument(c.dataset.pdf).promise.then(d => d.getPage(1)).then(pg => {
      const w = pg.getViewport({scale: 1}).width, v = pg.getViewport({scale: 88 / w * (devicePixelRatio || 1)});
      c.width = v.width; c.height = v.height; c.style.display = "block";
      return pg.render({canvasContext: c.getContext("2d"), viewport: v}).promise;
    }).catch(() => c.remove());
  });
}
function pdfBlock(p){
  if(!p.pdf) return "";
  const u = encodeURI(p.pdf);
  return `<a class="btn" href="${u}" download>Download PDF</a>
    <object class="pdf" data="${u}#toolbar=1&view=FitH" type="application/pdf" aria-label="PDF viewer">
      <p>Your browser cannot show PDFs inline. <a href="${u}" download>Download the PDF</a>.</p>
    </object>`;
}
function post(p){
  return `<a class="back" href="#research">&larr; All research</a><article><h1>${p.title}</h1>
    <p class="meta">${p.tag}, ${fmt(p.date)}, Rajvardhan</p>${pdfBlock(p)}${p.body}<p class="disc">${DISC}</p></article>`;
}
view.addEventListener("input", e => { if(e.target.id === "q"){ q = e.target.value; $("#rows").innerHTML = rowsHTML(); thumbs(); } });
view.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  tagF = b.dataset.tag; $("#chips").innerHTML = chips(); $("#rows").innerHTML = rowsHTML(); thumbs();
});
const PAGES = {
  research: list,
  about: () => `<h1>About</h1>${SITE.about.map(t => `<p class="lede">${t}</p>`).join("")}`,
  contact: () => `<h1>Contact</h1><p class="lede">Corrections, tips and collaboration:</p><p><a href="mailto:${SITE.email}">${SITE.email}</a></p>`,
  disclaimer: () => `<h1>Disclaimer</h1><p class="lede">${DISC}</p>`
};

function route(){
  const h = decodeURIComponent(location.hash.slice(1)) || "research";
  const p = POSTS.find(x => x.slug === h);
  view.innerHTML = p ? post(p) : (PAGES[h] || PAGES.research)();
  document.title = (p ? p.title + " | " : PAGES[h] && h !== "research" ? h[0].toUpperCase() + h.slice(1) + " | " : "") + SITE.name;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === (p ? "research" : h)));
  const qi = $("#q"); if(qi) qi.value = q;
  thumbs();
  window.scrollTo(0, 0);
}

/* ---------- theme toggle + ASCII backdrop ---------- */
const root = document.documentElement, tg = $("#tg");
function paint(){
  const pre = $("#ascii");
  if(root.dataset.t !== "blue"){ pre.textContent = ""; return; }
  const cols = Math.ceil(innerWidth / 7), rows = Math.ceil(innerHeight / 13), ch = " .:-=+*#%@";
  let out = "";
  for(let y = 0; y < rows; y++){
    for(let x = 0; x < cols; x++){
      const v = Math.sin(x * .05) + Math.sin(y * .1 + x * .02) + Math.sin((x + y) * .035) + Math.sin(Math.hypot(x - cols * .6, y - rows * .4) * .13);
      out += ch[Math.max(0, Math.min(9, Math.floor((v + 4) / 8 * 10)))];
    }
    out += "\n";
  }
  pre.textContent = out;
}
function setTheme(t){
  root.dataset.t = t;
  tg.textContent = t === "blue" ? "Theme: Black" : "Theme: Blue";
  tg.setAttribute("aria-pressed", t === "blue");
  try{ localStorage.setItem("ras-theme", t); }catch(e){}
  paint();
}
tg.addEventListener("click", () => setTheme(root.dataset.t === "blue" ? "black" : "blue"));
addEventListener("resize", paint);
let saved = "black"; try{ saved = localStorage.getItem("ras-theme") || "black"; }catch(e){}
setTheme(saved);
$("#yr").textContent = new Date().getFullYear();
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
